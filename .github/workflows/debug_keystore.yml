name: Debug Keystore Decoding

on:
  workflow_dispatch: # Позволяет запускать этот воркфлоу вручную из GitHub UI

jobs:
  decode_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (optional, but good practice)
        uses: actions/checkout@v4

      - name: Decode Keystore Test
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
        run: |
          echo "Attempting to decode UPLOAD_KEYSTORE..."
          echo "$UPLOAD_KEYSTORE" | base64 --decode > test_keystore.jks
          echo "Decoding attempt finished. Checking file size..."
          ls -l test_keystore.jks
          echo "If the file 'test_keystore.jks' was created and has a size > 0, decoding was successful."
          echo "If you see 'base64: invalid input', the secret content is still incorrect."
